<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="dom.js" defer></script>
    <script src="add-project-module.js" defer></script>
</head>

<body> 
   <!-- Contains the application name -->
    <div class="appNameContainer">
        <header>ADHD ASSISTANT</header>
    </div>
<!-- This is the main container for the SIDEBAR and DISPLAY -->
    <div class="appFrameContainer">
        <!-- Contains the sidebar with all the features -->
        <div class="sidebarContainer">
<!-- Contains the function that allows to generate a new project -->

            <div class="addProjectContainer"></div>
<!-- Contains a list of all generated projects -->
            <div class="sidebarProjectDisplayContainer"></div>

        </div>
<!-- Contains the top panel and the list of tasks generated in form of cards -->
        <div class="taskDisplayContainer">
            <!--Contains the Project name, ADD TASK function -->
            <div class="taskDisplayTopPanel"> TASK TITLE  +  BUTTON ADD TASK</div>
            <!-- Contains all generated tasks in form of cards, listed one bellow the other -->
            <div class="taskCardContainer"> CARD 1 <BR></BR> CARD 2</div>
        </div>
    </div>
</body>

</html>
