<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/project.css">
    <link rel="stylesheet" href="./css/task.css">
</head>

<body>
    <!-- Contains the application name -->
    <div class="appNameContainer">
        <header>ADHD ASSISTANT</header>
    </div>
    <!-- This is the main container for the SIDEBAR and DISPLAY -->
    <div class="appFrameContainer">
        <!-- Contains the sidebar with all the features -->
        <div class="sidebarContainer">
            <!-- Contains the function that allows to generate a new project -->

            <div class="addProjectContainer">
                 <button class="addProjectBtn">+ Create project</button>
                <div class="addProjectTextContainer"></div></div>
            <!-- Contains a list of all generated projects -->
            <div class="projectCardDisplay">

            </div>

        </div>
        <!-- Contains the top panel and the list of tasks generated in form of cards -->
        <div class="taskDisplayContainer">
            <!--Contains the Project name, ADD TASK function -->
            <div class="taskDisplayTopPanel"> 
                <div class="projectNameDisplay"></div>
                <button class="addTaskBtn">+ Create task</button>
            </div>
            <!-- Contains all generated tasks in form of cards, listed one bellow the other -->
            <div class="taskCardContainer"></div>
        </div>
    </div>
</body>

</html>
